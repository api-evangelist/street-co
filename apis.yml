name: Street.co.uk
kind: company
description: >-
  Street.co.uk (Street Systems Limited, Manchester, England) is a UK estate
  agency CRM and property management platform for residential sales, lettings, property
  management and client accounting. In the United Kingdom there is no MLS and no RESO
  — residential listing distribution runs from agency CRM software out to the Rightmove
  and Zoopla portals — which places Street.co.uk at the agency system-of-record layer
  of the value chain, upstream of the portal duopoly and alongside Reapit, Alto and
  Apex27. Its API posture is unusually open for this sector: three OpenAPI 3.1 contracts
  (Street Open API, Property Feed, Spectre) are published unauthenticated on a public
  Scalar developer portal at developers.street.co.uk and can be downloaded as JSON
  or YAML by anyone. Access to the data behind them is not open — production bearer
  tokens are generated inside a paying agency's Street account under Settings >
  Account Administration > Applications, and a non-customer developer must email
  apis@street.co.uk to be issued a sandbox token on the staging environment. Nothing
  RESO, no OData $metadata, and no open government data is published by Street.co.uk
  itself; the open UK property data layer sits with HM Land Registry and Ordnance Survey,
  not with the CRM vendors.
