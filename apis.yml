- aid: street-co:street-property-feed-api
  name: Street Property Feed API
  description: A read-only property feed API for powering an agency's own website and
    property search — sales search, lettings search, a single property record, area
    lookups and a property features list. Five paths, all GET, documented in a published
    OpenAPI 3.1 contract. Serves the UK's portal-and-agency-website distribution model
    rather than any MLS or IDX arrangement.
