apis:
- aid: street-co:street-open-api
  name: Street Open API
  description: The main Street.co.uk platform API — a JSON:API-conformant REST interface
    over the estate agency system of record, covering properties, sales and lettings
    instructions, offers, applicants, viewings, valuations, tenancies, tenants, landlords,
    vendors, maintenance jobs and requests, inspections, invoices, documents, e-sign
    documents, notes, tasks, users, branches and brands, plus read access to portal
    listings. 74 paths and 80 operations documented in a published OpenAPI 3.1 contract.
  humanURL: https://developers.street.co.uk/docs/street-open-api
  baseURL: https://street.co.uk/open-api/v1
  tags:
