- aid: street-co:spectre-api
  name: Spectre API
  description: The public API for the Spectre products, documented on the Street.co.uk
    developer portal and integrated into the Street CRM. Covers Spectre Property Reports
    (create and retrieve property reports, retrieve report leads) and Spectre email
    marketing (contacts and segments). Six paths documented in a published OpenAPI
    3.1 contract; tokens are issued by the Spectre team on email request.
  humanURL: https://developers.street.co.uk/docs/spectre-api-docs
  baseURL: https://api.spectre.uk.com/v1
