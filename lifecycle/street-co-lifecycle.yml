  current: v1
  introduced: '2023-07-07'
  breaking_change_policy: >-
    Not published as a policy document. Observed practice across 111 dated changelog entries
    (2022-10-06 to 2026-03-06) is additive-only within v1: fields and endpoints are added,
    superseded members are marked Deprecated with a replacement rather than removed.
  docs: https://developers.street.co.uk/docs/street-open-api/updates/open-api-updates
