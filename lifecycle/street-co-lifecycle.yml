summary: >-
  Street.co.uk runs a single, long-lived v1 of each API with an additive change policy,
  documented as a dated public changelog per API. Deprecations are announced in that changelog
  with a named replacement field or relationship and the deprecated members are also flagged
  deprecated: true inside the published OpenAPI. There is no separate deprecation-policy
  document, no Sunset/Deprecation response headers (RFC 8594), no published SLA, and no public
  status page.
