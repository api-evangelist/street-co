model: >-
  A single HTTP bearer token per application, applied globally in all three OpenAPI documents
  via a root-level security requirement. There is no OAuth 2.0 flow, no OIDC discovery, no
  scope vocabulary and no refresh mechanism published — a token is a long-lived opaque bearer
  credential carrying the permissions of the issuing Street account, which is why Street's own
  help centre warns that handing a Public API token to a third party gives that supplier access
  to client data in the account.
