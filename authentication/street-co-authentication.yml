token_issuance:
- api: Street Open API
  method: self-serve-in-product
  path: Settings > Account Administration > Applications
  requires: An active Street.co.uk subscription and a company-admin user in that account.
  docs: https://intercom.help/streetcouk/en/articles/8474378-generating-an-api-token
  note: >-
    The help centre asks the admin to name the application and pick the relevant feed from an
    "API token scope" drop-down — that selects between the Property Feed API and the Public
    (Open) API. It is a feed selector, not an OAuth scope vocabulary; no scope strings are
    published.
- api: Street Open API (staging)
  method: email-request
  contact: apis@street.co.uk
  quote: >-
    "if you would like a sandbox account on our staging environment, please email
    apis@street.co.uk to request a token."
- api: Street Property Feed API
  method: self-serve-in-product
  path: Settings > Applications
- api: Spectre API
  method: email-request
  contact: apis@spectre.uk.com
  quote: If you do not have an API token, please contact the Spectre team at apis@spectre.uk.com.
token_handling:
  rotation_policy: undocumented
  expiry: undocumented
  revocation: Delete the application in the Street CRM Applications screen.
  transport: HTTPS only (HSTS enabled on street.co.uk, max-age 31536000)
