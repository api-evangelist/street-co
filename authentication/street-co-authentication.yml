- name: your-api-token
  type: http
  scheme: bearer
  header: Authorization
  format: 'Authorization: Bearer YOUR_API_TOKEN_HERE'
  sources:
  - openapi/street-co-open-api-openapi.yml
  - openapi/street-co-spectre-api-openapi.yml
- name: your_api_token
  type: http
