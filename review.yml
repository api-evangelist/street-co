      version: '1.0'
      parsed: true
    - file: openapi/street-co-spectre-api-openapi.yml
      original: openapi/_original/street-co-spectre-api-openapi.json
      sourceURL: https://developers.street.co.uk/docs/spectre-api-docs/api-reference/openapi.json
      httpStatus: 200
      contentType: application/json; charset=utf-8
