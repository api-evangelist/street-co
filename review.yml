      httpStatus: 200
      contentType: application/json; charset=utf-8
      bytes: 721641
      openapi: 3.1.0
      title: Street Open API
      version: '1.0'
      parsed: true
      note: A YAML rendering of the identical document is also served at
        .../api-reference/openapi.yaml (HTTP 200, text/yaml, 474116 bytes); it was
        fetched and confirmed byte-different but semantically identical (same 74
        paths, no webhooks). The JSON is retained verbatim as the original.
    - file: openapi/street-co-property-feed-api-openapi.yml
      original: openapi/_original/street-co-property-feed-api-openapi.json
      sourceURL: https://developers.street.co.uk/docs/street-property-feed-api/api-reference/openapi.json
      httpStatus: 200
      contentType: application/json; charset=utf-8
