actions:
  apisYmlCreated: true
  openapiHarvested: 3
  operationsDocumented: 94
  reason: |
    Three genuinely public OpenAPI 3.1 contracts were downloaded anonymously,
    validated, and stored with their verbatim sources. apis.yml lists all three as
    real APIs with documented base URLs. No endpoint, host, scope, or specification
    was invented. RESO absence and the customer/email access gate are recorded as
    separate facts from the openness of the contract itself.
