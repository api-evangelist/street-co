      description: JSON:API relationships object for a Task. Each member is a relationship object whose `data` is a resource identifier (`type` + `id`). Supply at most one todoable subject the Task is about — keyed by the relationship name (e.g. `property`, `sale`); the key is a label and is not significant to the server, only its `data.type` and `data.id` are read. A `todoType` may be supplied to categorise the Task and, if present, MUST be keyed exactly `todoType`. At least one member is required.
