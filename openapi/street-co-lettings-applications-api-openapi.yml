openapi: 3.2.0
info:
  title: Street Open Lettings Applications API
  description: Build on top of the UKs most advanced Estate Agency software.
  version: '1.0'
  contact:
    name: Street API Development Team
    url: https://street.co.uk
    email: apis@street.co.uk
servers:
- url: https://street.co.uk/open-api/v1
  description: Production.
- url: https://demo.street.co.uk/open-api/v1
  description: Testing.
security:
- your-api-token: []
tags:
- name: Lettings Applications
  description: Lettings Application endpoints for this API.
paths:
  /lettings-applications/{application_id}:
    parameters:
    - schema:
        type: string
        format: uuid
      name: application_id
      in: path
      required: true
      description: The UUID of the Application.
    get:
      summary: Get a single Lettings Application
      description: This endpoint retrieves a single lettings application by its `UUID`.
      tags:
      - Lettings Applications
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LettingsApplication'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/IncludedProperty'
                      - $ref: '#/components/schemas/IncludedEpc'
                      - $ref: '#/components/schemas/IncludedSafetyCertificate'
                      - $ref: '#/components/schemas/IncludedDownloadableMedia'
                      - $ref: '#/components/schemas/IncludedTenancy'
                      - $ref: '#/components/schemas/IncludedApplicant'
                      - $ref: '#/components/schemas/IncludedPerson'
                      - $ref: '#/components/schemas/IncludedTenancyAgreement'
                      - $ref: '#/components/schemas/IncludedHoldingDeposit'
                      - $ref: '#/components/schemas/IncludedMeterReading'
                  links:
                    $ref: '#/components/schemas/IncludedLinks'
                  meta:
                    type: object
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '415':
          $ref: '#/components/responses/415'
        '500':
          $ref: '#/components/responses/500'
      operationId: get-lettings-applications-application_id
      parameters:
      - schema:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum:
            - property
            - tenancy
            - tenancyAgreement
            - holdingDeposit
            - applicant
            - applicant.people
            - epc
            - safetyCertificates
            - tenancyGuide
            - landlordOfferLetter
            - tenantGuarantorReferenceForm
            - tenantGuarantorReferenceReport
            - tenantGuarantorIdDocument
            - generatedDocument
            - meterReadings
        in: query
        name: include
        description: Optional related entities to include in the results supplied as a comma separated list.
        style: form
        explode: false
components:
  schemas:
    HoldingDepositAttributes:
      title: Holding Deposit (attributes)
      type: object
      properties:
        amount:
          type:
          - integer
          - 'null'
          example: 495
        received_at:
          type:
          - string
          - 'null'
          format: date-time
    SafetyCertificateAttributes:
      title: SafetyCertificateAttributes
      type: object
      properties:
        media:
          type: object
          properties:
            document:
              type: string
              format: uri
              example: https://street.co.uk/certificates/safetyCertificate.pdf
        certificate_type:
          type: string
          enum:
          - alarm_service
          - asbestos_check
          - automated_gates
          - boiler_service
          - building_compliance
          - building_insurance
          - carbon_monoxide
          - chimney_sweep
          - damp_proofing
          - eic
          - electric
          - fire_detection
          - fire_door_assesment
          - fire_equipment
          - gas
          - health
          - heat_recovery_system
          - hmo_license
          - homecare_plan
          - landlord_registration
          - lead_water_testing
          - legion
          - lighting_safety
          - oil_safety_check
          - pat
          - remcon_service
          - rent_guarantee_insurance
          - rent_smart_wales_registered
          - risk
          - saniflow_service_and_descaler
          - selective_license
          - smoke_alarm
          - smoke_ventilation_system_service_aov
          - sump_pump_service
          - tree_management
          - tv_license
          - velux_window_service
        type:
          type: string
          deprecated: true
          description: 'Deprecated: use certificate_type instead.'
          enum:
          - alarm_service
          - asbestos_check
          - automated_gates
          - boiler_service
          - building_compliance
          - building_insurance
          - carbon_monoxide
          - chimney_sweep
          - damp_proofing
          - eic
          - electric
          - fire_detection
          - fire_door_assesment
          - fire_equipment
          - gas
          - health
          - heat_recovery_system
          - hmo_license
          - homecare_plan
          - landlord_registration
          - lead_water_testing
          - legion
          - lighting_safety
          - oil_safety_check
          - pat
          - remcon_service
          - rent_guarantee_insurance
          - rent_smart_wales_registered
          - risk
          - saniflow_service_and_descaler
          - selective_license
          - smoke_alarm
          - smoke_ventilation_system_service_aov
          - sump_pump_service
          - tree_management
          - tv_license
          - velux_window_service
        notes:
          type:
          - string
          - 'null'
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
        valid_to:
          type: string
          format: date-time
        reminder_at:
          type:
          - string
          - 'null'
          format: date-time
        renewed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IncludedResource:
      title: Included Resource
      type: object
      examples: []
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        attributes:
          type: object
        relationships:
          type:
          - object
          - 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    EmailAddressSimple:
      title: Email Address (simple)
      description: An email address, can be related to a person and/or a company.
      type: object
      properties:
        value:
          type: string
          example: john@johndoe.com
          format: email
        notes:
          type:
          - string
          - 'null'
        primary:
          type: boolean
    LettingsApplicationAttributes:
      title: Lettings Application (included)
      type: object
      properties:
        application_status:
          example: pending
          enum:
          - successful
          - unsuccessful
          - in_progress
          - pending
          - cancelled
        desired_tenancy_length:
          type: integer
          example: 12
        desired_move_in_date:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        agreed_move_in_date:
          type:
          - string
          - 'null'
          format: date-time
        price:
          type: integer
        price_frequency:
          type: string
          enum:
          - Per Week
          - Per 2 Weeks
          - Per 4 Weeks
          - Per Calendar Month
          - Per Quarter
          - Per 6 Months
          - Per Annum
    jsonApiErrorResponseBody:
      title: JSON:API Error Response Body
      description: Response body for JSON:API errors, containing an array of `errors` in place of the `data` property provided in JSON:API success responses. Used for non-400/500 error codes where only a single error is expected.
      type: object
      properties:
        meta:
          type: object
        source:
          type: object
          description: The primary source of the conflict for 409 responses.
          properties:
            pointer:
              type: string
              description: JSON Pointer to the conflicting request value.
            parameter:
              type: string
              description: URI parameter related to the conflict.
        errors:
          description: An array of error objects providing additional information about problems encountered while processing the request.
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/jsonApiError'
      required:
      - errors
    IncludedProperty:
      title: Property (included)
      allOf:
      - $ref: '#/components/schemas/IncludedResource'
      - type: object
        properties:
          type:
            type: string
            enum:
            - property
          attributes:
            $ref: '#/components/schemas/PropertyAttributes'
          relationships:
            type: object
            properties:
              branch:
                allOf:
                - $ref: '#/components/schemas/RelationshipSingular'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - branch
    TenancyAgreementAttributes:
      title: Tenancy Agreement (attributes)
      type: object
      properties:
        start_date:
          type:
          - string
          - 'null'
          format: date-time
        end_date:
          type:
          - string
          - 'null'
          format: date-time
        tenancy_term_type:
          type:
          - string
          - 'null'
          enum:
          - Periodic
          - Fixed
          - null
        tenancy_type:
          type:
          - string
          - 'null'
          enum:
          - Assured Shorthold
          - Excluded
          - Assured
          - Non-assured
          - Regulated
          - Company Let
          - HMO
          - License
          - Assured Periodic Tenancy
          - null
        rent_amount:
          type:
          - integer
          - 'null'
          example: 495
        rent_frequency:
          type:
          - string
          - 'null'
          enum:
          - Per Week
          - Per 2 Weeks
          - Per 4 Weeks
          - Per Calendar Month
          - Per Quarter
          - Per 6 Months
          - Per Annum
          - null
        payment_day:
          type:
          - integer
          - 'null'
          example: 15
        payment_reference:
          type:
          - string
          - 'null'
          example: 123ABC
        deposit_amount:
          type:
          - integer
          - 'null'
          example: 900
        deposit_scheme:
          type:
          - string
          - 'null'
          enum:
          - DPS - Custodial
          - DPS - Insured
          - TDS - Custodial
          - TDS - Insured
          - My Deposits - Custodial
          - My Deposits - Insured
          - Reposit
          - LPS Scotland
          - SafeDeposits Scotland - Custodial
          - My Deposits - Scotland - Custodial
          - Deposit Replacement
          - Held by Agent
          - Held by Landlord
          - null
        management_fee:
          type:
          - number
          - 'null'
          example: 10.7
        management_fee_type:
          type:
          - string
          - 'null'
          enum:
          - Percentage
          - Fixed Fee
          - null
        additional_clauses:
          type:
          - string
          - 'null'
        tenancy_agreement_sent_at:
          type:
          - string
          - 'null'
          format: date-time
        tenancy_agreement_signed_at:
          type:
          - string
          - 'null'
          format: date-time
    RelationshipSingular:
      title: Relationship Singular
      description: Inheritable schema for 1:1 relationships. Data may be null if the relationship is empty.
      type: object
      properties:
        data:
          oneOf:
          - type: object
            properties:
              type:
                type: string
              id:
                type: string
                format: uuid
                example: a827a3ae-4c74-4c32-8b42-42248d4010d3
            required:
            - type
            - id
          - type: 'null'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
            related:
              $ref: '#/components/schemas/Link'
    LettingsApplication:
      allOf:
      - $ref: '#/components/schemas/BaseModel'
      - type: object
        properties:
          type:
            type: string
            enum:
            - lettings_application
          attributes:
            $ref: '#/components/schemas/LettingsApplicationAttributes'
          relationships:
            $ref: '#/components/schemas/DownloadableMedia'
    IncludedSafetyCertificate:
      title: Safety Certificate (included)
      allOf:
      - $ref: '#/components/schemas/IncludedResource'
      - type: object
        properties:
          type:
            type: string
            enum:
            - safetyCertificate
          attributes:
            $ref: '#/components/schemas/SafetyCertificateAttributes'
    TelephoneNumberSimple:
      title: Telephone Number (simple)
      description: An telephone number, can be related to a person and/or a company.
      type: object
      properties:
        value:
          type: string
          example: '+441632960911'
        notes:
          type:
          - string
          - 'null'
        primary:
          type: boolean
    PersonAttributes:
      title: Person (attributes)
      type: object
      properties:
        full_name:
          type: string
        title:
          type:
          - string
          - 'null'
          example: Mrs
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        address:
          oneOf:
          - $ref: '#/components/schemas/AddressSimple'
          - type: 'null'
        telephone_numbers:
          type: array
          items:
            $ref: '#/components/schemas/TelephoneNumberSimple'
        email_addresses:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddressSimple'
        marketing_consent:
          type:
          - boolean
          - 'null'
        contact_preferences:
          type: object
          properties:
            email:
              type: boolean
            post:
              type: boolean
            text:
              type: boolean
            phone:
              type: boolean
        statuses:
          type: object
          minProperties: 3
          maxProperties: 3
          additionalProperties: false
          properties:
            vendor:
              type:
              - string
              - 'null'
              enum:
              - null
              - Current
              - Previous
            landlord:
              type:
              - string
              - 'null'
              enum:
              - null
              - Current
              - Previous
            tenant:
              type:
              - string
              - 'null'
              enum:
              - null
              - Current
              - Previous
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Link:
      title: Link
      oneOf:
      - description: a string containing the link's URL
        type: string
        format: uri-reference
      - type: object
        required:
        - href
        properties:
          href:
            description: a string containing the link's URL
            type: string
            format: uri-reference
          meta:
            $ref: '#/components/schemas/Meta'
    TenancyAttributes:
      title: Tenancy (attributes)
      type: object
      properties:
        active:
          type: boolean
        status:
          type: string
          enum:
          - active
          - cancelled
          - ended
          - ending
          - expiring
          - renewed
          - renewing
          - upcoming
        start_date:
          type: string
          format: date-time
        end_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Null for periodic tenancies, which have no fixed end date.
        original_term_start_date:
          type: string
          format: date-time
        tenancy_type:
          anyOf:
          - type: string
            enum:
            - Assured Shorthold
            - Excluded
            - Assured
            - Non-assured
            - Regulated
            - Company Let
            - HMO
            - License
            - Assured Periodic Tenancy
          - type: 'null'
        tenancy_term_type:
          type: string
          enum:
          - Periodic
          - Fixed
        rent_amount:
          type: integer
          example: 495
        rent_frequency:
          type: string
          enum:
          - Per Week
          - Per 2 Weeks
          - Per 4 Weeks
          - Per Calendar Month
          - Per Quarter
          - Per 6 Months
          - Per Annum
        deposit_amount:
          type:
          - integer
          - 'null'
          example: 900
        service_level:
          type:
          - string
          - 'null'
          example: Fully Managed
        service_level_type:
          anyOf:
          - type: string
            enum:
            - Let Only
            - Rent Collection
            - Fully Managed
            - Other
          - type: 'null'
        management_fee:
          type:
          - string
          - 'null'
          example: 10%
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IncludedDownloadableMedia:
      allOf:
      - $ref: '#/components/schemas/IncludedResource'
      - type: object
        properties:
          type:
            type: string
            enum:
            - downloadable_media
          attributes:
            $ref: '#/components/schemas/DownloadableMediaAttributes'
      examples: []
      title: Downloadable Media (included)
      x-tags:
      - Media
    DownloadableMedia:
      title: Downloadable Media
      x-tags:
